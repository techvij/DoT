services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dot_test
      POSTGRES_USER: dot_user
      POSTGRES_PASSWORD: dot_pass
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dot_user -d dot_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  dot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dot_test
      POSTGRES_USER: dot_user
      POSTGRES_PASSWORD: dot_pass
    command: python -m dot run --config config/checks.yaml
