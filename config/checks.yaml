connections:
  default:
    type: postgres
    env: .env

# Optional report layer — add ANTHROPIC_API_KEY and/or SLACK_WEBHOOK_URL to .env to use.
# Remove the '#' from the lines you want to activate.
#
# report:
#   claude:
#     enabled: true          # AI diagnostic summary after each run
#   slack:
#     enabled: true
#     notify_on: warn_fail   # always | warn_fail (default) | fail_only

checks:
  - table: orders
    column: status
    check: null_rate
    threshold: 0.10     # fail if > 10% null
    severity: high

  - table: orders
    check: row_count
    min_rows: 500
    severity: high

  - table: events
    column: created_at
    check: freshness
    max_age_hours: 24
    severity: critical

  - table: orders
    column: order_id
    check: duplicate
    severity: high

  - table: payments
    column: amount
    check: value_range
    min: 0
    max: 1000000
    severity: high

  - table: orders
    check: schema_drift
    severity: medium

  # BigQuery connection example (swap out the postgres block above):
  #
  # connections:
  #   default:
  #     type: bigquery
  #     project: my-gcp-project-id
  #     dataset: my_dataset            # default dataset for unqualified table names
  #     # credentials_file: /path/to/sa_key.json   # omit to use ADC (gcloud / Cloud Shell)
  #
  # Table names in checks can be:
  #   'orders'                          → uses project + dataset from above
  #   'my_dataset.orders'               → uses project from above
  #   'my-project.my_dataset.orders'    → fully self-contained

  # allowed_values: fail if a column contains values outside a defined set,
  # or (with require_all: true) if any listed value is absent from the data.
  # NULLs are always ignored (use null_rate to catch those separately).
  #
  # - table: orders
  #   column: status
  #   check: allowed_values
  #   values: completed,pending,cancelled,refunded
  #   require_all: true   # also fail if any listed value never appears in the column
  #   severity: high

  # duplicate: supports composite grain via 'columns' list (or single 'column').
  #
  # - table: order_items
  #   check: duplicate
  #   columns: [order_id, product_id, line_number]
  #   severity: high

  # row_count with run-over-run delta: fail if count changes by > 20% from last run.
  # Alternative to min_rows (fixed threshold) and rolling-average self-calibration.
  #
  # - table: orders
  #   check: row_count
  #   max_delta_pct: 0.20
  #   severity: high

  # cardinality: COUNT(DISTINCT col) must stay within bounds.
  # Catches dimension load failures where a bad DELETE+INSERT collapses distinct values.
  #
  # - table: products
  #   column: category
  #   check: cardinality
  #   min_distinct: 5
  #   max_distinct: 50
  #   severity: high

  # custom_sql: run any SQL and assert the result equals expect.
  # Use {table} as a placeholder — resolved with correct quoting per connector.
  #
  # - table: orders
  #   check: custom_sql
  #   sql: "SELECT COUNT(*) FROM {table} WHERE refund_amount > order_total"
  #   expect: 0
  #   severity: high

  # regex: all non-null values must match a pattern.
  # Uses ~ on Postgres, REGEXP_CONTAINS on BigQuery.
  #
  # - table: users
  #   column: email
  #   check: regex
  #   pattern: '^[^@]+@[^@]+\.[^@]+$'
  #   severity: high

  # Example: composite partition filter for BigQuery-style partitioned tables.
  # Uncomment and adapt when targeting a partitioned table.
  #
  # - table: events_partitioned
  #   column: created_at
  #   check: freshness
  #   max_age_hours: 6
  #   severity: high
  #   partition_column: year/month/date
  #   partition_value: 2026/05/01
